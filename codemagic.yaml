# Codemagic CI/CD Configuration for FoodScan iOS App
# See: https://docs.codemagic.io/

workflows:
  ios-workflow:
    name: iOS Build - FoodScan
    max_build_duration: 45

    environment:
      flutter: 3.24.0
      xcode: latest
      cocoapods: default

    scripts:
      # Install Flutter dependencies
      - flutter pub get

      # Install CocoaPods dependencies
      - cd ios
      - pod install
      - cd ..

      # Build iOS app
      - flutter build ios --release --no-codesign

    artifacts:
      - build/ios/iphoneos/Runner.ipa
