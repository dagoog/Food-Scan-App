# Codemagic CI/CD Configuration for FoodScan iOS App
# See: https://docs.codemagic.io/

workflows:
  ios-workflow:
    name: iOS Build - FoodScan
    max_build_duration: 45

    environment:
      # Flutter version
      flutter: 3.24.0

      # CocoaPods cache
      cocoapods:
        cache: true
        pods_path: ios/Pods

    cache_directories:
      - ~/Pods
      - ~/.cocoapods

    scripts:
      # Install dependencies
      - flutter pub get

      # Install CocoaPods dependencies
      - cd ios && pod install && cd ..

      # Build iOS app
      - flutter build ios --release --no-codesign

    artifacts:
      # IPA file for download
      - build/ios/iphoneos/Runner.ipa

    publishing:
      # Email notifications (optional - remove if not needed)
      emails:
        notify:
          on_success: true
          on_failure: false
        recipients:
          - recipient-email@example.com
